<script>const P=[{s:"spencer-singlet",n:"Spencer Singlet",c:"Singlets",d:"The Spencer Singlet is our flagship innerwear piece \u2014 an architecturally engineered, sleeveless foundation garment crafted for rigorous all-day performance. Knitted from ultra-fine long-staple combed cotton with subtle micro-stretch, it contours cleanly to the torso to eliminate excess fabric bulk. The extended stay-tuck length ensures it remains securely anchored beneath trousers and business shirts, while reinforced armholes and an ergonomic scoop neckline prevent riding, twisting, or irritation even in demanding tropical climates.",i:["assets/products/1. Spencer Singlet/P01.1.webp","assets/products/1. Spencer Singlet/P01.2.webp","assets/products/1. Spencer Singlet/P01.3.webp","assets/products/1. Spencer Singlet/P01.4.webp","assets/products/1. Spencer Singlet/P01.5.webp","assets/products/1. Spencer Singlet/P01.6.webp"],col:[{n:"White",b:"#FFFFFF",i:"assets/products/1. Spencer Singlet/P01.1.webp"}],f:[["Pure Combed Cotton","Ultra-breathable weave engineered specifically for high tropical heat."],["Architectural Stay-Tuck Fit","Sits flat and smooth under any shirt with zero bunching or rolling."],["Reinforced Shape Retention","Double-needle hem stitching survives wash after wash without distortion."]],r:[{q:"\u201CThe stay-tuck length is genuine. I wear it under my business shirts in Victoria Island heat and it never rolls up or bunches.\u201D",n:"Babatunde A.",m:"Verified Buyer \u2022 Lagos"},{q:"\u201CThe fabric is so soft and light against the skin. Absorbs sweat cleanly without feeling damp or heavy throughout the day.\u201D",n:"Kelechi N.",m:"Verified Buyer \u2022 Port Harcourt"},{q:"\u201CDoesn't lose its neck elasticity after 25+ laundry washes. The reinforced stitching is genuinely top grade.\u201D",n:"Ibrahim B.",m:"Verified Buyer \u2022 Kaduna"}],sp:[["Premium Ribbed Cotton","Soft against the skin and highly breathable to keep you fresh throughout the day in any climate."],["Classic Tailored Fit","Close-fitting silhouette engineered to stay tucked and sit flat under shirts without bunching or rolling."],["Reinforced Armholes","Double-needle hem and collar stitching ensure the garment survives wash after wash without distortion."],["All-Day Comfort","Lightweight, friction-free construction designed for effortless everyday wear."]]},{s:"stripe-singlet",n:"Stripe Singlet",c:"Singlets",d:"The Stripe Singlet delivers the same precision-engineered fit and premium combed cotton construction as our Spencer line, now with a clean ribbed stripe pattern that adds subtle visual dimension. Designed for men who want their innerwear to look as considered as it feels. The stripe detail is woven directly into the fabric so it never fades, cracks, or peels.",i:["assets/products/2. Stripe Singlet/P02.1.webp","assets/products/2. Stripe Singlet/P02.2.webp","assets/products/2. Stripe Singlet/P02.3.webp","assets/products/2. Stripe Singlet/P02.4.webp","assets/products/2. Stripe Singlet/P02.5.webp","assets/products/2. Stripe Singlet/P02.6.webp"],col:[{n:"White",b:"#FFFFFF",i:"assets/products/2. Stripe Singlet/P02.1.webp"}],f:[["Woven Stripe Detail","Pattern is intrinsic to the fabric and never fades, cracks, or peels with washing."],["Premium Combed Cotton","Breathable, lightweight structure optimised for tropical heat and daily wear."],["Secure Neck and Armhole Finish","Reinforced ribbed edges hold shape and resist distortion over time."]],r:[{q:"\u201CThe stripe gives it a premium edge over a plain singlet. Looks great under an open button shirt too.\u201D",n:"Chidi O.",m:"Verified Buyer \u2022 Enugu"},{q:"\u201CBought 6 packs and the quality is completely consistent across all of them. Strong stitching on every single one.\u201D",n:"Emeka S.",m:"Verified Buyer \u2022 Abuja"},{q:"\u201CDoesn't lose its neck elasticity after 25+ laundry washes. The reinforced stitching is genuinely top grade.\u201D",n:"Tunde F.",m:"Verified Buyer \u2022 Ibadan"}],sp:[["Premium Ribbed Cotton","Soft against the skin and highly breathable to keep you fresh throughout the day in any climate."],["Classic Tailored Fit","Close-fitting silhouette engineered to stay tucked and sit flat under shirts without bunching or rolling."],["Reinforced Armholes","Double-needle hem and collar stitching ensure the garment survives wash after wash without distortion."],["All-Day Comfort","Lightweight, friction-free construction designed for effortless everyday wear."]]},{s:"plain-singlet",n:"Plain Singlet",c:"Singlets",d:"The Plain Singlet is the purest expression of the Mellow philosophy: nothing extra, nothing missing. Crafted from 100% combed cotton in a clean, unembellished form, it is the ideal base layer for any outfit and any occasion. Soft against skin, minimal in silhouette, and built to last through the harshest wash cycles without losing its shape or colour.",i:["assets/products/3. Plain Singlet/P03.1.webp","assets/products/3. Plain Singlet/P03.2.webp","assets/products/3. Plain Singlet/P03.3.webp","assets/products/3. Plain Singlet/P03.4.webp","assets/products/3. Plain Singlet/P03.5.webp","assets/products/3. Plain Singlet/P03.6.webp"],col:[{n:"White",b:"#FFFFFF",i:"assets/products/3. Plain Singlet/P03.1.webp"}],f:[["100% Combed Cotton","Soft, breathable and gentle on skin, perfect for all-day wear in any climate."],["Clean Minimal Silhouette","Lies flat under any shirt with no texture, print, or bulk to show through."],["Fade and Shrink Resistant","Pre-washed and treated to maintain colour and fit after repeated laundering."]],r:[{q:"\u201CPerfect plain singlet. No fuss, no gimmicks. Just good quality cotton that does exactly what it should.\u201D",n:"Seun A.",m:"Verified Buyer \u2022 Lagos"},{q:"\u201COrdered a bulk pack for my shop. Every customer who buys comes back for more. Very reliable product.\u201D",n:"Nnamdi O.",m:"Verified Buyer \u2022 Onitsha"},{q:"\u201CDoesn't lose its neck elasticity after 25+ laundry washes. The reinforced stitching is g orts that fade, shrink, or lose collar elasticity after a few washes, Mellow delivers authentic Indian-standard combed cotton craftsmanship with reinforced double stitching at an affordable everyday price point. Rapid shelf turnover, high customer repeat purchases, and zero return rates mean steady, predictable daily profit for shop owners."],["Is the stock supply guaranteed year-round?","Yes. With our dedicated direct manufacturing facility in Tiruppur and consistent monthly container offloading into our central Lagos logistics hubs, Mellow guarantees uninterrupted year-round inventory continuity so your business never suffers revenue-draining stockouts on core colors and sizes."],["What benefits does the end consumer get beyond superior fabric quality?","Beyond 100% breathable, skin-friendly combed cotton tailored for Nigeria\u2019s climate, consumers enjoy tamper-evident hygienic packaging, true-to-body African sizing, accessible luxury pricing that outperforms generic market alternatives, and ongoing consumer promotional rewards and giveaways in selected packs."],["What profit margins can distributors and retailers expect?","Mellow is structured to provide healthy, sustainable margins at every level: Retailers achieve comfortable 25% to 40% gross margins on shelf turnover. Distributors receive direct ex-factory container-level pricing yielding strong 12% to 20% net wholesale margins on fast-rotating capital, supplemented by quarterly volume rebates."]],faq=(e,t)=>`<section class="sec soft"><div class="wrap">${head(e,t,"","center")}<div class="faq ${rv()}">${FAQ.map((i,s)=>`<div class="fq"><button class="fq-q" aria-expanded="false"><span class="q">${String(s+1).padStart(2,"0")}</span><span class="t">${i[0]}</span><span class="pm"></span></button><div class="fq-a"><div><p>${i[1]}</p></div></div></div>`).join("")}</div></div></section>`,interHero=e=>`<section class="hero"><div class="bgw"><div class="px" data-par=".12"><img class="bg" src="${img(e.img)}" alt="${e.a
